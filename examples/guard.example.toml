# Copy to ~/.config/agenthub/guard.toml on an agent machine to customize the
# hooks. Everything is optional; omitted keys use the defaults shown.
#
# Since 0.3.6 agenthub holds no commands for approval: Claude Code's permission
# mode decides, and only fetching the hub's dashboard is refused. The old keys
# protected_branches, shared_branches, disabled_rules and [[rules]] are ignored.

# How many times in a row the Stop hook may keep an agent working because of
# unread messages addressed to it.
stop_max_continuations = 3
