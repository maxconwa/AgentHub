{% from "_chatlist.html" import chat_list with context %}
{#- The Chat button's window (GET /ui/messenger), loaded into <section id="messenger"> by app.js: every chat, newest
    first. A row opens that chat in the slide-in panel. -#}
<div class="mhead"><h2 id="messenger-title">Chats</h2><button type="button" class="icon-btn" data-messenger-close aria-label="Close chats">✕</button></div>
<input type="search" class="msearch" data-chat-filter placeholder="Search chats" aria-label="Search chats" autocomplete="off">
<div class="mscroll" hx-get="/ui/messenger" hx-select=".mlists" hx-trigger="every 10s" hx-swap="innerHTML">
{{ chat_list() }}
</div>
