{% from "_macros.html" import prompt_only %}
<section class="compose-panel panel" aria-labelledby="compose-title">
  <div class="section-head"><h2 id="compose-title">Prompt: {{ label }}</h2>
    <a href="{{ back }}" hx-get="/ui/compose/close" hx-target="#compose" hx-swap="innerHTML">Cancel</a></div>
  {% if not agents %}<p class="muted">No active agents to prompt here.</p>
  {% else %}
  <form class="stack" method="post" action="/ui/prompts">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label>Prompt <textarea name="body" rows="3" maxlength="4000" required autofocus placeholder="What should they do?"></textarea></label>
    {{ prompt_only(prompt) }}
  </form>
  {% endif %}
</section>
