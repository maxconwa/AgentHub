[project]
name = "agenthub"
version = "0.3.9.0"
description = "A secure coordination hub for Claude Code agents"
readme = "README.md"
authors = [
    { name = "maxconway" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py==4.2.0",
    "mcp>=2.3.0",
    "mdit-py-plugins==0.6.1",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
agenthub = "agenthub:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
